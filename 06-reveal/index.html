<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 リビール</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--ink:#1c1f26;--bg:#f5f5f2;--line:#d8d8d2;--accent:#c2410c}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic Medium",Meiryo,sans-serif;line-height:1.7}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;position:sticky;top:0;z-index:10}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;letter-spacing:.06em}
nav{display:flex;gap:26px;margin-left:auto}
nav a{color:#444;text-decoration:none;padding:6px 2px;display:inline-block;position:relative;overflow:hidden;transition:color .3s}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--accent);transform:translateX(-101%);transition:transform .32s ease}
nav a:hover{color:var(--ink)}
nav a:hover::after{transform:translateX(0)}
main{max-width:1120px;margin:0 auto;padding:56px 24px 100px;min-height:48vh}
h1{font-size:32px;margin:0 0 10px}
p{color:#555;margin:0 0 16px}
footer{border-top:1px solid var(--line);background:#fff;padding:26px 24px}
.foot{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:26px;align-items:center}
.foot a{color:#555;text-decoration:none;padding:6px 2px;display:inline-block;position:relative;overflow:hidden;transition:color .3s}
.foot a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--accent);transform:translateX(-101%);transition:transform .32s ease}
.foot a:hover{color:var(--ink)}
.foot a:hover::after{transform:translateX(0)}
.copy{margin-left:auto;color:#8a8a86;font-size:13px}
</style></head>
<body>
<header><div class="bar"><div class="brand">DXWEB</div><nav><a href="#">Home</a><a href="#">About</a><a href="#">Service</a><a href="#">Contact</a></nav></div></header>
<main>
  <h1>06 リビール</h1>
  <p>ホバーすると、下線が右からスーッとスライドして現れる、落ち着いた動きです。</p>
  <p>基本形（dxweb2）からのアレンジサンプルです。</p>
</main>
<footer><div class="foot"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Support</a><span class="copy">&copy; 2026 DXWEB</span></div></footer>
</body></html>
