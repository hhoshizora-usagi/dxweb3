<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 グロー</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--ink:#1c1f26;--bg:#12141a;--line:#2a2e38;--tx:#dfe4ee;--tx2:#a7b0c2;--glow:#7cc4ff}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic Medium",Meiryo,sans-serif;line-height:1.7}
header{background:rgba(18,20,26,.92);border-bottom:1px solid var(--line);padding:18px 24px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;letter-spacing:.06em}
nav{display:flex;gap:26px;margin-left:auto}
nav a{color:var(--tx2);text-decoration:none;padding:6px 2px;display:inline-block;transition:color .35s,text-shadow .35s}
nav a:hover{color:#fff;text-shadow:0 0 12px rgba(124,196,255,.85),0 0 26px rgba(124,196,255,.45)}
main{max-width:1120px;margin:0 auto;padding:56px 24px 100px;min-height:48vh}
h1{font-size:32px;margin:0 0 10px}
p{color:var(--tx2);margin:0 0 16px}
footer{border-top:1px solid var(--line);background:#0d0f14;padding:26px 24px}
.foot{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.foot a{color:var(--tx2);text-decoration:none;padding:6px 2px;display:inline-block;transition:color .35s,text-shadow .35s}
.foot a:hover{color:#fff;text-shadow:0 0 12px rgba(124,196,255,.85),0 0 26px rgba(124,196,255,.45)}
.copy{margin-left:auto;color:#6c7486;font-size:13px}
</style></head>

<header><div class="bar"><div class="brand">DXWEB</div><nav><a href="#">Home</a><a href="#">About</a><a href="#">Service</a><a href="#">Contact</a></nav></div></header>
